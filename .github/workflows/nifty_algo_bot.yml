name: NIFTY 50 Algo Bot & Scanners

on:
  schedule:
    # Monday to Friday at 03:45 UTC (09:15 AM IST) - Market Trading Session
    - cron: '45 3 * * 1-5'
    # Saturday at 03:30 UTC (09:00 AM IST) - Weekly Audit Report
    - cron: '30 3 * * 6'
    # Sunday at 03:30 UTC (09:00 AM IST) - Nifty 50 RSI Scan
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'trade'
        type: choice
        options:
          - trade
          - weekly_report
          - sunday_scan
          - reset_scratch

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Max 6 hours execution (covers 09:15 to 15:00 IST market session)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Algo Action
        env:
          API_KEY: ${{ secrets.ANGEL_API_KEY }}
          CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DAY_OF_WEEK=$(date +%u) # 1=Mon, 6=Sat, 7=Sun
          if [ "${{ github.event.inputs.action }}" = "weekly_report" ] || [ "$DAY_OF_WEEK" = "6" ]; then
            echo "Running Saturday Weekly Audit Report..."
            python app.py --weekly
          elif [ "${{ github.event.inputs.action }}" = "sunday_scan" ] || [ "$DAY_OF_WEEK" = "7" ]; then
            echo "Running Sunday Nifty 50 RSI Scan..."
            python app.py --sunday
          elif [ "${{ github.event.inputs.action }}" = "reset_scratch" ]; then
            echo "Resetting bot history..."
            python app.py --reset
          else
            echo "Running Live Trading Engine (Console Mode)..."
            python app.py --no-ui
          fi
